# Serves the self-contained viz at https://vigji.github.io/muse-spark-open-charter/
name: Deploy viz to Pages

on:
  push:
    branches: ["main"]
    paths: ["reconstruction/viz/charter_viz_standalone.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir _site && cp reconstruction/viz/charter_viz_standalone.html _site/index.html && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
